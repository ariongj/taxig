<!DOCTYPE html>
<html lang="cnr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica nije pronađena – Taxi Gusinje</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e17">
  <link rel="icon" href="/taxig/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0a0e17; --text: #eef2f8; --muted: #a2adc2; --yellow: #ffd000; --ink: #15120a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
      background: radial-gradient(900px 500px at 50% 110%, rgba(240, 164, 82, 0.35), transparent 60%), linear-gradient(180deg, #0a0e17, #131b33);
    }
    main { max-width: 520px; }
    svg.mark { width: 64px; height: 64px; margin: 0 auto 22px; display: block; }
    .code { font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--yellow); }
    h1 { margin: 10px 0 12px; font-size: 34px; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.01em; }
    p { margin: 0 0 8px; color: var(--muted); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
    a.btn { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 12px; font-weight: 600; text-decoration: none; }
    .primary { background: var(--yellow); color: var(--ink); }
    .ghost { border: 1px solid rgba(255, 255, 255, 0.18); color: var(--text); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#ffd000"/><path d="M6.5 28.5 15 13.5l4.6 7.6 3.6-4.6 10.3 12z" fill="#0a0e17"/><path d="M13.2 16.7 15 13.5l1.9 3.1-1.1-.5-.8.8-.8-.8z" fill="#ffd000"/><path d="M8 33.5h24" stroke="#0a0e17" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4.2 3.4"/></svg>
    <p class="code">404</p>
    <h1>Ovaj put ne vodi nigdje</h1>
    <p>Stranica koju tražite ne postoji. Taxi Gusinje vas i dalje vozi – 24/7.</p>
    <p lang="sq">Kjo faqe nuk ekziston. · <span lang="en">This page does not exist.</span></p>
    <div class="actions">
      <a class="btn primary" href="/taxig/">Početna · <span lang="sq">Kryefaqja</span> · <span lang="en">Home</span></a>
      <a class="btn ghost" href="tel:+38269685205">+382 69 685 205</a>
    </div>
  </main>
</body>
</html>
